<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form>
        <fieldset>
            <p>
            <legend>Form Login</legend>
            <label for="username">Usernam :</label>
            <input name="username" type="text" id="username" maxlength="25">
            </p>

            <p>
            <label for="pass">Password :</label>
            <input name="pass" type="password" id="pass" maxlength="8">
            </p>

            <p>
            <input type="submit" name="btn" id="button" value="submit">
            <input type="reset" name="btn" id="btn" value="reset">
            </p>
        </fieldset>
    </form>
    <p>&nbsp;</p>
</body>
</html>
