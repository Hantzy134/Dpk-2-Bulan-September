<!DOCTYPE html>
<html>
    <head>
        <title>Form Pendaftaran Kursus</title>
    </head>
    <body>
        <form>
            <fieldset>
               <legend>Form Pendaftaran Kursus</legend>
               <table>
                <tr>
                    <td><label>Nama  </label></td>
                    <td>:</td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td><label>Jenis Kelamin </label></td>
                    <td>:</td>
                    <td><input type="radio" name="jk">Wanita</td>
                </tr>

                <tr>
                    <td></td>
                    <td></td>
                    <td><input type="radio" name="jk">Pria</td>
                </tr>

                <tr>
                    <td><label>Kursus yang akan diikuti</label></td>
                    <td>:</td>
                    <td>
                        <select>
                            <option>Design Grafis</option>
                            <option>Pemrograman Web</option>
                            <option>Keamanan Jaringan</option>
                            <option>Perkantoran</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Pilihan</td>
                    <td>:</td>
                    <td><input type="checkbox">Senin</td>
                </tr>

                <tr>
                    <td></td>
                    <td></td>
                    <td><input type="checkbox">Selasa</td>
                </tr>

                <tr>
                    <td></td>
                    <td></td>
                    <td><input type="checkbox">Rabu</td>
                </tr>

                <tr>
                    <td></td>
                    <td></td>
                    <td><input type="checkbox">Kamis</td>
                </tr>

                <tr>
                    <td></td>
                    <td></td>
                    <td><input type="checkbox">Jumat</td>
                </tr>

                <tr>
                    <td>Alamat</td>
                    <td>:</td>
                    <td><textarea></textarea></td>
                </tr>

                <tr>
                    <td></td>
                    <td></td>
                    <td>
                        <input type="submit" name="btn" id="submit" value="Submit">
                        <input type="submit" name="btn" id="reset" Value="Reset">
                    </td>
                </tr>
               </table>
            </fieldset>
        </form>
    </body>
</html>
