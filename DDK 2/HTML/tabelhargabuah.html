<!DOCTYPE html>
<html>
    <head>
        <title>Tabel Harga Buah</title>
    </head>
    <body>
        <h2 align="center">Tabel Harga Buah</h2>
        <table border="2" cellpadding="8" cellspacing="0" width="85%" align="center">
             <caption><b>Stok Toko Buah</b></caption>
            <th rowspan="2" bgcolor="B8F8FF">Nama Buah</th>
            <th colspan="2" bgcolor="B8F8FF">Detail</th>
            <tr>
                <th bgcolor="B8F8FF">Stok</th>
                <th bgcolor="B8F8FF">Harga (Rp)</th>
            </tr>
              
            <tr>
            <td>Apel</td>            
            <td align="center">10 Kg</td>            
            <td align="right">30.000</td>     
            </tr>
           
            <tr>
            <td>Jeruk</td>
            <td align="center">15 Kg</td>
            <td align="right">25.000</td>
            </tr>

            <tr bgcolor="FDFFB8">
            <th colspan="2" align="right">Total Jenis Buah</th>
            <td align="center">2 Jenis</td>
            </tr>
        </table>
    </body>
</html>
